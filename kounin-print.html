<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字 練習プリント | 江原予備校</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"UD Digi Kyokasho NK-R","BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#e9ecf2;color:#111;line-height:1.5}

  /* 画面上部のツールバー(印刷しない) */
  .toolbar{position:sticky;top:0;z-index:10;background:#001858;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .toolbar h1{font-size:16px;flex:1;min-width:200px}
  .toolbar label{font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
  .toolbar button,.toolbar a.b{font:inherit;font-size:14px;font-weight:bold;border:none;border-radius:20px;padding:8px 18px;cursor:pointer;text-decoration:none;background:#fff;color:#001858}
  .toolbar .primary{background:#f582ae;color:#fff;font-size:16px;padding:10px 26px}
  .note{max-width:210mm;margin:10px auto 0;padding:0 8px;font-size:12px;color:#5e6472}

  /* A4 の用紙 */
  .sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:12mm 14mm;box-shadow:0 2px 10px rgba(0,0,0,.15);page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}

  .sh-head{display:flex;align-items:flex-end;gap:10px;border-bottom:2px solid #001858;padding-bottom:4px;margin-bottom:8px}
  .sh-title{font-size:17px;font-weight:bold;flex:1}
  .sh-title small{font-size:12px;font-weight:normal;color:#444;margin-left:6px}
  .sh-round{background:#001858;color:#fff;padding:2px 14px;border-radius:14px;font-size:14px;font-weight:bold}
  .sh-name{display:flex;gap:18px;font-size:13px;margin-bottom:8px;justify-content:flex-end}
  .sh-name span{border-bottom:1px solid #333;display:inline-block;min-width:40mm;text-align:left}

  /* お手本 */
  .model{border:1.5px solid #001858;border-radius:6px;margin-bottom:8px;padding:5px 8px}
  .model h3{font-size:12px;color:#001858;margin-bottom:3px}
  .model-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(32mm,1fr));gap:4px}
  .m{border:1px dashed #999;border-radius:4px;padding:2px 6px;text-align:center}
  .m .k{font-size:17px;font-weight:bold;line-height:1.3}
  .m .r{font-size:11px;color:#c1121f}
  .m .mn{font-size:9px;color:#555;line-height:1.25}

  /* 問題 */
  .item{margin-bottom:5mm;break-inside:avoid;page-break-inside:avoid}
  .it-top{display:flex;align-items:baseline;gap:6px;font-size:15px;line-height:1.4;margin-bottom:1mm}
  .no{display:inline-block;min-width:7mm;font-weight:bold}
  .kind{display:inline-block;font-size:11px;font-weight:bold;color:#fff;border-radius:4px;padding:0 6px;flex-shrink:0}
  .kind.w{background:#c1121f}.kind.r{background:#0f766e}
  .pr{font-size:16px}
  .pr u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;font-weight:bold}
  .hint{font-size:11px;color:#555;margin-left:auto;white-space:nowrap}
  .boxes{display:flex;flex-wrap:wrap;gap:0;margin-left:13mm}
  .bx{width:12mm;height:12mm;border:1.2px solid #333;margin-right:-1.2px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#888;position:relative;background:
      linear-gradient(#ccc,#ccc) center/100% 0.4px no-repeat,linear-gradient(#ccc,#ccc) center/0.4px 100% no-repeat}
  .bx.pre{background:#f4f4f4}
  .boxes.sm .bx{width:9mm;height:9mm;font-size:13px}
  .dense .item{margin-bottom:2mm}.dense .bx{width:9.5mm;height:9.5mm}.dense .boxes.sm .bx{width:8mm;height:8mm}.dense .boxes.read .bx{height:9.5mm}.dense .it-top{font-size:14px}
  .boxes.read .bx{background:none;height:11mm}
  .boxes.read.sm .bx{height:9mm}

  /* 答え */
  .ans h2{font-size:15px;margin:6px 0 4px;color:#001858}
  .ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px}
  .ans-col h4{font-size:12px;background:#001858;color:#fff;border-radius:10px;padding:0 10px;display:inline-block;margin-bottom:3px}
  .ans-col div{font-size:12.5px;border-bottom:1px dotted #bbb;padding:1px 0}
  .ans-col .k{display:inline-block;font-size:10px;font-weight:bold;color:#fff;border-radius:3px;padding:0 4px;margin-right:3px}
  .xdense .item{margin-bottom:1.3mm}.xdense .bx,.xdense .boxes.read .bx,.xdense .boxes.sm .bx{width:8mm;height:8mm;font-size:12px}.xdense .it-top{font-size:13px;margin-bottom:.4mm}.xdense .pr{font-size:14px}.xdense .sh-name{margin-bottom:4px}
.xdense.sheet{padding-top:9mm;padding-bottom:6mm}.xdense .model{margin-bottom:4px}.xdense .m{padding:0 6px}
  .foot{font-size:10px;color:#777;text-align:right;margin-top:4px}

  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .toolbar,.note{display:none!important}
    .sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm;padding:12mm 14mm}
  }
</style>
</head>
<body>
<div class="toolbar">
  <h1 id="tb-title">練習プリント</h1>
  <label><input type="checkbox" id="opt-model" checked> お手本をつける(1回目)</label>
  <label><input type="checkbox" id="opt-ans"> 答えのページをつける</label>
  <button id="btn-shuffle" type="button">🔀 問題の順番を変える</button>
  <a class="b" id="btn-back" href="kounin-kanji-index.html">← インデックス</a>
  <button class="primary" id="btn-print" type="button">🖨 印刷する</button>
</div>
<p class="note">用紙はA4・たて向きです。印刷画面で「余白:なし(または標準)」「背景のグラフィック:オン」にするときれいに印刷できます。</p>
<div id="pages"></div>

<script src="kounin-data.js"></script>
<script src="kounin-worksheet.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var unit=parseInt(q.get('unit'),10), setNo=parseInt(q.get('set'),10)||0;
  var D=window.KDATA[unit];
  var pages=document.getElementById('pages');
  if(!D){pages.innerHTML='<p style="padding:30px">ユニットが見つかりません。インデックスから開き直してください。</p>';return;}
  var back=document.getElementById('btn-back');
  back.href='kounin-kanji-index.html';
  var sets=setNo?[D.sets[setNo-1]].filter(Boolean):D.sets;
  if(!sets.length){pages.innerHTML='<p style="padding:30px">セットが見つかりません。</p>';return;}
  document.getElementById('tb-title').textContent='Unit '+unit+' '+D.name+(setNo?'  セット'+setNo:'  全セット')+' 練習プリント';
  document.title='漢字練習プリント Unit'+unit+(setNo?' セット'+setNo:'')+' | 江原予備校';

  var CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function boxesHtml(it){
    var html='',cnt=it.kind==='write'?it.cells.length:it.n;
    var sm=cnt>13?' sm':'';
    if(it.kind==='write'){
      html+='<div class="boxes'+sm+'">'+it.cells.map(function(c){return c.pre?'<span class="bx pre">'+esc(c.pre)+'</span>':'<span class="bx"></span>';}).join('')+'</div>';
    }else{
      var s='';for(var i=0;i<it.n;i++)s+='<span class="bx"></span>';
      html+='<div class="boxes read'+sm+'">'+s+'</div>';
    }
    return html;
  }
  function itemHtml(it,i){
    var pr=it.parts.map(function(p){return p.u?'<u>'+esc(p.t)+'</u>':esc(p.t);}).join('');
    return '<div class="item"><div class="it-top"><span class="no">'+CIRC.charAt(i)+'</span>'+
      '<span class="kind '+(it.kind==='write'?'w':'r')+'">'+(it.kind==='write'?'書き':'読み')+'</span>'+
      '<span class="pr">'+pr+'</span><span class="hint">'+esc(it.hint||'')+'</span></div>'+boxesHtml(it)+'</div>';
  }
  function modelHtml(items){
    return '<div class="model"><h3>📌 お手本(見て覚えよう)</h3><div class="model-grid">'+items.map(function(e){
      if(unit===9||unit===10){var rel=unit===9?'≒':'⇔';return '<div class="m" style="grid-column:span 2;display:flex;align-items:baseline;justify-content:center;gap:6px"><span class="k" style="font-size:14px">'+esc(e.w1)+'</span><span class="r">'+esc(e.r1)+'</span><span>'+rel+'</span><span class="k" style="font-size:14px">'+esc(e.w2)+'</span><span class="r">'+esc(e.r2)+'</span></div>';}
      return '<div class="m"><div class="k">'+esc(e.kanji)+'</div><div class="r">'+esc(e.reading||'')+'</div><div class="mn">'+esc(e.meaning||'')+'</div></div>';
    }).join('')+'</div></div>';
  }
  function headHtml(set,r){
    return '<div class="sh-head"><div class="sh-title">Unit '+unit+' '+esc(D.name)+'<small>セット'+set.id+'(No.'+set.items[0].no+'〜'+set.items[set.items.length-1].no+')</small></div>'+
      '<span class="sh-round">'+r+'回目</span></div>'+
      '<div class="sh-name"><div>名前 <span>&nbsp;</span></div><div>日付 <span>&nbsp;</span></div></div>';
  }
  function ansHtml(set,rounds){
    var h='<div class="sheet"><div class="sh-head"><div class="sh-title">【答え】Unit '+unit+' '+esc(D.name)+'<small>セット'+set.id+'</small></div></div><div class="ans-grid">';
    rounds.forEach(function(items,r){
      h+='<div class="ans-col"><h4>'+(r+1)+'回目</h4>'+items.map(function(it,i){
        return '<div>'+CIRC.charAt(i)+' <span class="k" style="background:'+(it.kind==='write'?'#c1121f':'#0f766e')+'">'+(it.kind==='write'?'書':'読')+'</span>'+esc(it.answer)+'</div>';
      }).join('')+'</div>';
    });
    return h+'</div><div class="foot">江原予備校</div></div>';
  }

  var model=document.getElementById('opt-model'), ans=document.getElementById('opt-ans');
  function build(){
    var html='';
    sets.forEach(function(set){
      var rounds=KWS.makeRounds(unit,set.items,Math.random);
      rounds.forEach(function(items,r){
        html+='<div class="sheet'+((items.length>10||(r===0&&model.checked))?' dense':'')+((items.length>12||(items.length>10&&r===0&&model.checked))?' xdense':'')+'">'+headHtml(set,r+1)+(r===0&&model.checked?modelHtml(set.items):'')+
          items.map(itemHtml).join('')+'<div class="foot">江原予備校 漢字練習プリント</div></div>';
      });
      if(ans.checked)html+=ansHtml(set,rounds);
    });
    pages.innerHTML=html;
  }
  // 答えページを正しく対応させるため、再生成時は同じ乱数で作るのではなく毎回まとめて作り直す
  build();
  model.addEventListener('change',build);
  ans.addEventListener('change',build);
  document.getElementById('btn-shuffle').addEventListener('click',build);
  document.getElementById('btn-print').addEventListener('click',function(){window.print();});
  if(q.get('print')==='1'){setTimeout(function(){window.print();},600);}
})();
</script>
</body>
</html>
